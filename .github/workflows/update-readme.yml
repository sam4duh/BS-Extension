name: Update last-updated time

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          NOW=$(date -u +"%B %d, %Y, %H:%M UTC")
          sed -i "s|<!-- last-updated -->.*<!-- /last-updated -->|<!-- last-updated -->${NOW}<!-- /last-updated -->|" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update last-updated time" && git push)
